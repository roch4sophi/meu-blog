
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog Tech</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Meu blog tech</h1>
        <p>Um espaço para compartilhar ideias, programação e tecnologia.</p>
    </header>

    <main>
        <article>
            <h2>Meu primeiro post</h2>

            <p class="artigo-autor">Por: Sophia</p>

            <img src="tecnologia.jpg"
                alt="Notebook com códigos de programação">

            <p>
                Boas-vindas ao meu blog! Aqui vou compartilhar dicas de
                programação e curiosidades sobre tecnologia.
            </p>

            <div class="area-curtida">
                <button class="botao-curtir" id="curtir"
                    aria-label="Curtir publicação" aria-pressed="false">

                    <span class="coracao">♡</span>
                    <span class="contador">0</span>

                </button>
            </div>

        </article>
    </main>

    <script>
        const botao = document.querySelector("#curtir");
        const coracao = botao.querySelector(".coracao");
        const contador = botao.querySelector(".contador");

        let curtiu = false;
        let totalCurtidas = 0;

        botao.addEventListener("click", function () {

            if (curtiu === false) {
                totalCurtidas++;
                curtiu = true;

                coracao.textContent = "♥";
                botao.classList.add("curtido");

            } else {
                totalCurtidas--;
                curtiu = false;

                coracao.textContent = "♡";
                botao.classList.remove("curtido");
            }

            contador.textContent = totalCurtidas;
            botao.setAttribute("aria-pressed", curtiu);
        });
    </script>

</body>
</html>
